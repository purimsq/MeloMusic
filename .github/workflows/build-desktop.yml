name: Build MUSE Windows Desktop Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm install

      - name: Build Desktop Web Assets
        working-directory: desktop
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: AIzaSyCWsTjzGo1m4wk-dx2vrfcfFCrJZHkbAVE
          VITE_FIREBASE_AUTH_DOMAIN: melo-bc6cc.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: melo-bc6cc
          VITE_FIREBASE_STORAGE_BUCKET: melo-bc6cc.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '524826675391'
          VITE_FIREBASE_APP_ID: 1:524826675391:web:bfed19776d4af523635e0a
          VITE_FIREBASE_MEASUREMENT_ID: G-HDBBY0XKGV

      - name: Package Windows Installer (.exe) with electron-builder
        working-directory: desktop
        run: npx --yes electron-builder --win --x64 --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload MUSE Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUSE-Windows-Setup-exe
          path: desktop/release/*.exe
          if-no-files-found: error
