name: Build MUSE Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Production Assets
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY || 'AIzaSyCWsTjzGo1m4wk-dx2vrfcfFCrJZHkbAVE' }}
          VITE_FIREBASE_AUTH_DOMAIN: melo-bc6cc.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: melo-bc6cc
          VITE_FIREBASE_STORAGE_BUCKET: melo-bc6cc.firebasestorage.app
          VITE_FIREBASE_MESSAGING_SENDER_ID: '524826675391'
          VITE_FIREBASE_APP_ID: 1:524826675391:web:bfed19776d4af523635e0a
          VITE_FIREBASE_MEASUREMENT_ID: G-HDBBY0XKGV

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x android/gradlew

      - name: Build Debug APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload MUSE APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUSE-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
