<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#EBEBE9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MUSE" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>MUSE — Elevate Every Moment With Sound</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <!-- Hidden SVG clip-paths for the signature organic floral scalloped artwork masks -->
    <svg width="0" height="0" style="position: absolute; pointer-events: none;">
      <defs>
        <!-- 8-Lobe Scalloped Flower Mask for Full Player Artwork (250x250) -->
        <clipPath id="flower-mask-player" clipPathUnits="objectBoundingBox">
          <!-- Scaled to 0..1 bounding box for responsive perfection -->
          <path d="M 0.50 0.04 C 0.58 0.04 0.63 0.12 0.70 0.15 C 0.77 0.18 0.86 0.18 0.89 0.25 C 0.93 0.32 0.89 0.40 0.93 0.47 C 0.96 0.53 1.01 0.60 0.98 0.67 C 0.94 0.73 0.86 0.75 0.83 0.81 C 0.79 0.88 0.76 0.96 0.68 0.98 C 0.60 0.99 0.53 0.93 0.47 0.93 C 0.40 0.93 0.33 0.99 0.25 0.98 C 0.17 0.96 0.14 0.88 0.10 0.81 C 0.07 0.75 -0.01 0.73 0.02 0.67 C 0.04 0.60 0.09 0.53 0.07 0.47 C 0.05 0.40 0.01 0.32 0.05 0.25 C 0.08 0.18 0.17 0.18 0.24 0.15 C 0.30 0.12 0.36 0.04 0.50 0.04 Z"></path>
        </clipPath>

        <!-- Scalloped Mask for Artist Selection Bubbles (0..1) -->
        <clipPath id="flower-mask-artist" clipPathUnits="objectBoundingBox">
          <path d="M 0.50 0.05 C 0.60 0.05 0.66 0.14 0.73 0.17 C 0.80 0.20 0.88 0.21 0.91 0.29 C 0.94 0.36 0.90 0.44 0.94 0.51 C 0.97 0.58 1.01 0.64 0.98 0.71 C 0.94 0.78 0.86 0.79 0.82 0.85 C 0.78 0.91 0.74 0.98 0.66 0.99 C 0.58 1.00 0.52 0.93 0.45 0.93 C 0.38 0.93 0.32 1.00 0.24 0.99 C 0.16 0.98 0.12 0.91 0.08 0.85 C 0.04 0.79 -0.01 0.78 0.02 0.71 C 0.05 0.64 0.09 0.58 0.06 0.51 C 0.04 0.44 0.00 0.36 0.04 0.29 C 0.07 0.21 0.15 0.20 0.22 0.17 C 0.29 0.14 0.35 0.05 0.50 0.05 Z"></path>
        </clipPath>
      </defs>
    </svg>

    <!-- Hidden Background YouTube Audio Player Container for Ad-Free Master Streaming -->
    <div id="melo-yt-container" style="position: fixed; width: 1px; height: 1px; opacity: 0.001; pointer-events: none; left: -100px; bottom: -100px; z-index: -999;"></div>

    <!-- App Root -->
    <div id="app"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
